<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Creature Derby</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>%F0%9F%90%9B</text></svg>"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <header id="top">
        <div class="brand">
          <span class="mark">🐛</span>
          <span class="name">Creature Derby</span>
        </div>
        <div id="generation" class="stat"><span class="k">generation</span> <b>1</b></div>
        <div id="clock" class="stat"><span class="k">time</span> <b>0.0s</b></div>
        <div id="timerbar"><div id="timerfill"></div></div>
      </header>

      <main id="stagewrap">
        <canvas id="stage"></canvas>
        <div id="grid"><!-- panels injected here --></div>
        <div id="boot">loading physics…</div>
      </main>

      <footer id="controls">
        <div id="hint">the race is running</div>
        <div class="spacer"></div>
        <button id="replay" class="btn">Replay</button>
        <button id="breed" class="btn primary" disabled>Breed the next generation</button>
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
